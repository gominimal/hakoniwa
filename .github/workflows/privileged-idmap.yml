name: Privileged id maps

# Fork-only: the root-only tests for the privileged id-map change, which the
# upstream workflow cannot run (it tests as an unprivileged user), and a control
# that reverts the change's source and requires those tests to fail. The
# toolchain is the one gominimal/minimal pins (rust-toolchain.toml), which is
# what builds this crate there.
on:
  push:
    branches:
      - ci/privileged-idmap
  workflow_dispatch:

jobs:
  lints:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt install libseccomp-dev
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt install libseccomp-dev uidmap
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: The whole suite, unprivileged
        run: cargo test --all-features --all-targets -p hakoniwa -- --nocapture
      - name: The privileged tests, as root
        working-directory: hakoniwa
        # An explicit bash adds pipefail, so the tee below does not hide the
        # tests' exit status.
        shell: bash
        run: |
          BIN=$(cargo test --all-features --test container_test --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="container_test" and .executable!=null) | .executable')
          sudo "$BIN" privileged --nocapture --test-threads=1 2>&1 | tee privileged.log
          grep -q 'test result: ok. 4 passed' privileged.log
      - name: The idmapped-bind tests, as root
        working-directory: hakoniwa
        shell: bash
        run: |
          BIN=$(cargo test --all-features --test idmap_test --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="idmap_test" and .executable!=null) | .executable')
          sudo "$BIN" --nocapture --test-threads=1 2>&1 | tee idmap.log
          grep -q 'test result: ok. 4 passed' idmap.log

  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Without the change, a root map that is not onto root's own id goes to
      # newuidmap. The runner image ships it; a minimal root filesystem does
      # not, so the control moves the helpers out of PATH.
      - run: |
          sudo apt-get update
          sudo apt install libseccomp-dev
          for helper in newuidmap newgidmap; do
            path=$(command -v "$helper") || continue
            sudo mv "$path" "$path.hidden"
          done
          ! command -v newuidmap
      - uses: dtolnay/rust-toolchain@1.99.1
      # The upstream revision gominimal/minimal pins: every commit on this branch
      # sits on it, whatever CI commits are added.
      - name: Revert the change's source, keep its tests
        run: git checkout 0810ffa37620ef5c57de263c8eaa1f4d7633c14a -- hakoniwa/src && git status --short
      - name: The privileged tests must fail without the change
        working-directory: hakoniwa
        shell: bash
        run: |
          BIN=$(cargo test --all-features --test container_test --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="container_test" and .executable!=null) | .executable')
          if sudo "$BIN" privileged --nocapture --test-threads=1 2>&1 | tee control.log; then
            echo "::error::the privileged tests passed without the change; they do not test it"
            exit 1
          fi
          grep -E '^test .* (ok|FAILED)$' control.log
          grep -q 'test test_privileged_map_onto_own_id_is_unchanged ... ok' control.log
